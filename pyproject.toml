[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abalone-mlops"
version = "0.1.0"
authors = [{ name = "Rémi Barbier" }]
description = "Reproducible Abalone ring prediction with Prefect and FastAPI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4", "pandas==2.1.1", "scikit-learn==1.5.2", "scipy==1.16.3",
  "joblib==1.4.2", "matplotlib==3.8.4", "pyarrow==13.0.0", "mlflow==2.7.1",
  "prefect==2.13.7", "griffe==0.38.0", "pendulum==2.1.2", "SQLAlchemy==2.0.36",
  "cachetools==5.5.2", "pydantic==1.10.26", "fastapi==0.103.2", "uvicorn==0.23.2",
  "httpx==0.27.2", "setuptools==80.9.0",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.14.2", "pre-commit==4.2.0", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.25.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
